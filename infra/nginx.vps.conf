worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format nexo '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout nexo;
  error_log /dev/stderr warn;
  client_max_body_size 11m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 15s;
  send_timeout 30s;
  sendfile on;
  # Nginx sin root + read_only: /var/cache/nginx no admite escritura, y los
  # mounts tmpfs de Docker no conservan el propietario establecido en BUILD.
  # Todos los ficheros temporales van al /tmp tmpfs (modo 1777).
  client_body_temp_path /tmp/nexo-client-body;
  proxy_temp_path       /tmp/nexo-proxy;
  fastcgi_temp_path     /tmp/nexo-fastcgi;
  uwsgi_temp_path       /tmp/nexo-uwsgi;
  scgi_temp_path        /tmp/nexo-scgi;
  # Caddy es el salto público: este límite global se aplica a conexiones Caddy.
  # El middleware Node aplica además el límite por cuenta (hash de correo).
  limit_req_zone $binary_remote_addr zone=auth_budget:1m rate=4r/s;
  limit_req_status 429;
  server {
    listen 8080;
    listen [::]:8080 ipv6only=on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src blob:; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control 'no-store' always;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    # El handler de salud público lo necesita el frontend legado.
    location = /health { proxy_pass http://api:3000/health; }
    location = /ready { return 404; }
    location = /api/auth/login {
      limit_req zone=auth_budget burst=12 nodelay;
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 5s;
      proxy_read_timeout 65s;
    }
    location /api/ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 5s;
      proxy_read_timeout 65s;
    }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
  }
}
